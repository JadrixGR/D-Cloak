services:
  - type: web
    name: novashield
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: novashield-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PROFILE_DATA_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@novashield.local
      - key: ADMIN_NAME
        value: Nova Admin
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: DEFAULT_SERVER_IP
        sync: false

databases:
  - name: novashield-db
    plan: free
    databaseName: novashield
    user: novashield
